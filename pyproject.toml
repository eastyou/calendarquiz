[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "calendarquiz"
version = "0.1.0"
description = "日历与日期推理：可打印月历、星期推算、日期差与课堂练习生成"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "calendar", "math", "python", "teaching"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
calendarquiz = "calendarquiz.cli:main"

[tool.setuptools]
packages = ["calendarquiz"]
